name: Native iOS build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile model and transcript checks
        run: swift run --package-path ios/Core PolicyChecks
      - name: Build the native iPhone and iPad app
        run: >-
          xcodebuild -project ios/ObjectionIQ.xcodeproj -scheme ObjectionIQ
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build -resultBundlePath build/NativeBuild.xcresult
          CODE_SIGNING_ALLOWED=NO build
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-build
          path: build/NativeBuild.xcresult
          if-no-files-found: ignore
